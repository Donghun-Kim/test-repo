# yogiyo/cartyo 의 03.create-deployment-ticket.yml 모사본 (deploy 봇 Actions 연동 검증용).
# 관측 표면(워크플로 name · 트리거 · concurrency group · job 이름/needs 그래프/outputs)은 원본 그대로이고,
# 사내 의존만 치환했다 — self-hosted-runner-v2 → ubuntu-latest, yogiyo/actions-* → 더미 step, secrets 제거.
name: 03. Create Deployment Ticket

on:
  workflow_dispatch:
  push:
    branches:
      - proposed-release
      # chronos 전용 검증 브랜치 — 테스트 레포의 proposed-release 는 master 와 역사가 무관한 고아라
      # 체인이 fast-forward 로 올릴 수 없다. 그래서 master 계통의 전용 브랜치를 하나 더 받는다.
      - chronos-proposed-release

concurrency:
  group: lock-create-deployment-ticket

# 04·05 의 태그 push 용. 호출된 워크플로는 호출자의 권한을 넘을 수 없다.
permissions:
  contents: write

env:
  micro-service-name: "testyo"
  sub-service-name: "api"

jobs:
  generate-tag: # Get Image Tag
    runs-on: ubuntu-latest
    outputs:
      new-prod-tag: ${{ steps.generate_tag.outputs.new-prod-tag }}
      new-stg-tag: ${{ steps.generate_tag.outputs.new-stg-tag }}
      latest-prod-tag: ${{ steps.generate_tag.outputs.latest-prod-tag }}
      latest-stg-tag: ${{ steps.generate_tag.outputs.latest-stg-tag }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate Tag
        id: generate_tag
        uses: ./.github/actions/tag-generator
        with:
          env: 'prod'

      - name: Simulate step duration
        run: sleep 5   # 단계 지연 5초 — 봇이 "도는 중" 을 관측할 창(2026-11-06 에 3~10초 랜덤에서 고정으로 바꿨다)

  create-deployment-ticket:
    runs-on: ubuntu-latest
    needs: generate-tag
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Deployment Ticket
        id: deployment_ticket
        run: |
          echo "micro-service: ${{ env.micro-service-name }}/${{ env.sub-service-name }}"
          echo "deploy-stg-version:  ${{ needs.generate-tag.outputs.latest-stg-tag }}"
          echo "deploy-prod-version: ${{ needs.generate-tag.outputs.new-prod-tag }}"
          echo "current-prod-version: ${{ needs.generate-tag.outputs.latest-prod-tag }}"
          # 원본은 Jira DEPL 티켓을 만든다. 여기서는 만들지 않고 키 모양만 흉내낸다.
          echo "deployment-ticket-keys=DEPL-0000" >> "$GITHUB_OUTPUT"
          sleep 5   # 단계 지연 5초 — 봇이 "도는 중" 을 관측할 창(2026-11-06 에 3~10초 랜덤에서 고정으로 바꿨다)

      - name: Simulate step duration
        run: sleep 5   # 단계 지연 5초 — 봇이 "도는 중" 을 관측할 창(2026-11-06 에 3~10초 랜덤에서 고정으로 바꿨다)
  stage-deploy:
    needs: create-deployment-ticket
    if: ${{ endsWith(github.ref, 'proposed-release') }}   # 원본은 refs/heads/proposed-release 고정 — 전용 검증 브랜치를 함께 받으려 접미사로 넓혔다
    uses: ./.github/workflows/04.deploy-to-stg.yml
    secrets: inherit

  prod-deploy:
    if: ${{ endsWith(github.ref, 'proposed-release') }}   # 원본은 refs/heads/proposed-release 고정 — 전용 검증 브랜치를 함께 받으려 접미사로 넓혔다
    needs: stage-deploy
    uses: ./.github/workflows/05.deploy-to-prod.yml
    secrets: inherit
