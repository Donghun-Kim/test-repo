# yogiyo/cartyo 의 05.deploy-to-prod.yml 모사본. job 이름·needs 그래프·outputs·concurrency 는 원본 그대로.
# 치환: runner → ubuntu-latest, yogiyo/actions-* → 더미 step, secrets·OIDC·docker 빌드 제거(sleep 으로 소요만),
#       version-updater 의 차트 커밋 → prod 태그 push, Slack 알림 → echo.
# 원본의 `environment: 'prod'`(= 사람이 누르는 승인 지점)는 뺐다 — private 저장소 + GitHub Free 는
# environment 를 만들 수 없다. `waiting` 판정은 deploy_actions contract 테스트에서 고정 JSON 으로 검증한다.
# 원본 generate-tag 에는 `increment: 'minor'` 가 있으나 cartyo 실측 태그는 patch 증가(1.198.206→210)이고
# deploy_stage_tag/repos.json 도 cartyo 를 "patch" 로 둔다 — 액션 내부 해석이 다른 것으로 보이나 미확인이라
# 모사본은 실측을 따라 patch 로 둔다.
name: 05. (Manual) Deploy to Production

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  micro-service-name: "testyo"
  sub-service-name: "api"

jobs:
  get-prod-deploy-version:
    runs-on: ubuntu-latest
    outputs:
      prod-deploy-version: ${{ steps.deployment_ticket.outputs.prod-deploy-version }}
      deployment-ticket-keys: ${{ steps.deployment_ticket.outputs.deployment-ticket-keys }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get Deploy Version
        id: deployment_ticket
        run: |
          # 원본은 DEPL 티켓에서 배포 버전을 읽는다. 모사본은 티켓이 없으니 키 모양만 흉내낸다.
          {
            echo "prod-deploy-version="
            echo "deployment-ticket-keys=DEPL-0000"
          } >> "$GITHUB_OUTPUT"

  generate-tag: # Get Image Tag
    runs-on: ubuntu-latest
    outputs:
      new-prod-tag: ${{ steps.generate_tag.outputs.new-prod-tag }}
      new-stg-tag: ${{ steps.generate_tag.outputs.new-stg-tag }}
      latest-prod-tag: ${{ steps.generate_tag.outputs.latest-prod-tag }}
      latest-stg-tag: ${{ steps.generate_tag.outputs.latest-stg-tag }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate Tag
        id: generate_tag
        uses: ./.github/actions/tag-generator
        with:
          env: 'prod'   # 원본은 여기에 increment: 'minor' 가 더 붙는다(위 머리말 참조)

  prod-deployment-validator:
    runs-on: ubuntu-latest
    needs: [ get-prod-deploy-version, generate-tag ]
    outputs:
      prod-deploy-version: ${{ steps.deployment_ticket.outputs.prod-deploy-version }}
      deployment-ticket-keys: ${{ steps.deployment_ticket.outputs.deployment-ticket-keys }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prod Deployment Validation
        id: deployment_ticket
        run: |
          # 00.ci.yml 의 마커 방식 그대로 — 실패 경로를 재현할 때 이 파일을 커밋한다.
          if [ -f prod-should-fail ]; then
            echo "failure marker present for prod-deployment-validator"
            exit 1
          fi
          echo "deploy-prod-version: ${{ needs.generate-tag.outputs.new-prod-tag }}"
          echo "current-prod-version: ${{ needs.generate-tag.outputs.latest-prod-tag }}"
          {
            echo "prod-deploy-version=${{ needs.generate-tag.outputs.new-prod-tag }}"
            echo "deployment-ticket-keys=DEPL-0000"
          } >> "$GITHUB_OUTPUT"

  notify-migration-to-slack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check migrations
        id: check-migrations
        run: |
          # 원본과 같은 탐지 방식(diff 에 migrations 경로가 있는지). 봇 쪽 R3 가 보는 신호와 같다.
          changed="$(git diff --name-only HEAD~1 HEAD || true)"
          if echo "$changed" | grep -qE '(^|/)migrations/'; then
            echo "migration_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "migration_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post migration notification to a Slack channel
        if: steps.check-migrations.outputs.migration_changes == 'true'
        run: echo "[slack] 마이그레이션 변경 있음 — 배포 전 확인 필요"

  docker-build-and-push:
    needs: [ get-prod-deploy-version, generate-tag, prod-deployment-validator ]
    runs-on: ubuntu-latest
    outputs:
      image-path: ${{ steps.docker-build-push.outputs.image-path }}
      image-tags: ${{ steps.docker-build-push.outputs.image-tags }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Docker Build & Push
        id: docker-build-push
        run: |
          sleep 45
          {
            echo "image-path=ghcr.io/donghun-kim/testyo"
            echo "image-tags=${{ needs.generate-tag.outputs.new-prod-tag }}"
          } >> "$GITHUB_OUTPUT"

  version-updater: # Deployed by argoCD
    needs: [ generate-tag, get-prod-deploy-version, docker-build-and-push ]
    runs-on: ubuntu-latest
    # 원본: environment: 'prod' — 사람이 GitHub Environment 에서 승인할 때까지 이 job 이 waiting 으로 멈춘다.
    permissions:
      contents: write
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Replace image tag in manifest file
        id: version_updater
        run: |
          TAG='${{ needs.generate-tag.outputs.new-prod-tag }}'
          echo "JIRA_ISSUE_KEY=${{ needs.get-prod-deploy-version.outputs.deployment-ticket-keys }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "prod 태그 생성: $TAG → $GITHUB_SHA"

  update-deployment-ticket:
    runs-on: ubuntu-latest
    needs: [ generate-tag, get-prod-deploy-version, version-updater ]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Apply Prod Deployment
        id: deployment_ticket
        run: |
          echo "prod deploy 반영: ${{ needs.generate-tag.outputs.new-prod-tag }}"

  workflow-notification:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - update-deployment-ticket
    steps:
      - name: Set environment variable
        run: |
          if [ ${{ needs.update-deployment-ticket.result }} == 'success' ]
          then
            echo "job-status=success" >> $GITHUB_ENV
            echo "slack-message=All jobs completed successfully." >> $GITHUB_ENV
          else
            echo "job-status=fail" >> $GITHUB_ENV
            echo "slack-message=One or more jobs failed in the workflow." >> $GITHUB_ENV
          fi

      - name: Post Success Notification to a Slack channel
        run: echo "[slack] ${{ env.job-status }} — ${{ env.slack-message }}"

  # Sending notifications for the docker job
  docker-notification:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - docker-build-and-push
    steps:
      - name: Set environment variable
        run: |
          if [ ${{ needs.docker-build-and-push.result }} == 'success' ]
          then
            echo "job-status=success" >> $GITHUB_ENV
            echo "slack-message=Your docker image created successfully." >> $GITHUB_ENV
          else
            echo "job-status=fail" >> $GITHUB_ENV
            echo "slack-message=Your docker image creation failed." >> $GITHUB_ENV
          fi

      - name: Post Success Notification to a Slack channel
        run: echo "[slack] ${{ env.job-status }} — ${{ env.slack-message }}"
