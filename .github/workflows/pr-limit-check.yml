name: PR Limit Check

on:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      max_prs:
        description: 'Maximum number of open PRs allowed'
        required: false
        type: number
        default: 1

jobs:
  check-pr-limit:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check PR limit
        uses: actions/github-script@v7
        env:
          MAX_PRS: ${{ github.event.inputs.max_prs || 1 }}
        with:
          script: |
            const path = require('path');
            const scriptPath = path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/check-pr-limit.js');
            const checkPRLimit = require(scriptPath);
            await checkPRLimit({ context, github, core });
